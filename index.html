<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#073b70" />
    <title>出差記帳</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" id="topbar">
        <h1>出差記帳</h1>
      </header>

      <section id="tripListView" class="hidden" aria-live="polite">
        <section id="emptyState" class="empty-state hidden">
          <div class="empty-icon" aria-hidden="true">✦</div>
          <h2>建立第一趟出差</h2>
          <p>先填寫船名與港口，即可開始記錄每一筆花費。</p>
          <button class="primary-button" id="createFirstTripButton" type="button">新增出差</button>
        </section>
        <section id="tripListContent" class="trip-list-content hidden" aria-labelledby="tripListTitle">
          <div class="list-heading"><p>出差總列表</p><h2 id="tripListTitle">所有出差</h2></div>
          <ul id="tripList" class="trip-list trip-list--cards"></ul>
        </section>
      </section>

      <section id="tripView" class="hidden">
        <section class="trip-card" aria-labelledby="tripTitle">
          <div class="trip-card__topline">
            <button class="trip-card-action trip-card-action--back" id="tripMenuButton" aria-label="返回出差總列表" type="button">←</button>
            <div class="trip-card-actions">
              <button class="trip-card-action" id="editTripButton" aria-label="編輯出差" type="button">✎</button>
              <button class="trip-card-action" id="exportButton" aria-label="匯出目前出差 CSV" type="button">⇩</button>
              <button class="trip-card-action trip-card-action--danger" id="deleteTripButton" aria-label="刪除目前出差" type="button">×</button>
            </div>
          </div>
          <h2 id="tripTitle"></h2>
          <p class="port-line"><span aria-hidden="true">●</span><span id="portName"></span></p>
          <span class="ship-art" aria-hidden="true">⚓</span>
        </section>

        <section class="summary-card" aria-labelledby="summaryTitle">
          <div class="section-heading">
            <div>
              <span class="section-icon" aria-hidden="true">▣</span>
              <h2 id="summaryTitle">費用總覽</h2>
            </div>
            <span id="recordCount" class="record-count"></span>
          </div>
          <div id="currencyTotals" class="currency-grid" aria-live="polite"></div>
          <div class="category-grid" aria-label="費用分類小計">
            <div class="category-total transport"><span class="category-icon" aria-hidden="true">▰</span><span>交通費</span><strong id="total-transport">—</strong></div>
            <div class="category-total lodging"><span class="category-icon" aria-hidden="true">▣</span><span>住宿費</span><strong id="total-lodging">—</strong></div>
            <div class="category-total social"><span class="category-icon" aria-hidden="true">●●</span><span>交際費</span><strong id="total-social">—</strong></div>
            <div class="category-total misc"><span class="category-icon" aria-hidden="true">◇</span><span>雜支</span><strong id="total-misc">—</strong></div>
          </div>
          <p class="summary-note">分類小計依幣別分開計算</p>
        </section>

        <section class="expense-section" aria-labelledby="expenseTitle">
          <div class="section-heading expense-heading">
            <div>
              <span class="section-icon" aria-hidden="true">▤</span>
              <h2 id="expenseTitle">費用明細</h2>
            </div>
            <button class="filter-button" id="filterButton" type="button" aria-label="篩選費用">⌕</button>
          </div>
          <div id="filterBar" class="filter-bar hidden">
            <label>分類
              <select id="categoryFilter">
                <option value="all">全部分類</option>
                <option value="交通費">交通費</option>
                <option value="住宿費">住宿費</option>
                <option value="交際費">交際費</option>
                <option value="雜支">雜支</option>
              </select>
            </label>
            <label>幣別
              <select id="currencyFilter"><option value="all">全部幣別</option></select>
            </label>
          </div>
          <ul id="expenseList" class="expense-list" aria-live="polite"></ul>
          <div id="noExpenseState" class="no-expense hidden">尚無費用紀錄，從第一筆開始吧。</div>
        </section>
      </section>
    </main>

    <button id="addExpenseButton" class="add-button hidden" type="button"><span aria-hidden="true">＋</span> 新增費用</button>
    <button id="addTripButton" class="add-button add-trip-button hidden" type="button"><span aria-hidden="true">＋</span> 新增出差</button>

    <div id="modalBackdrop" class="modal-backdrop hidden" role="presentation"></div>

    <section id="tripModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="tripModalTitle">
      <div class="modal__header"><h2 id="tripModalTitle">新增出差</h2><button class="icon-button close-modal" type="button" aria-label="關閉">×</button></div>
      <form id="tripForm" class="form-stack">
        <input id="tripId" type="hidden" />
        <label>船名<input id="vesselName" required maxlength="60" placeholder="例如：EVER ACE" autocomplete="off" /></label>
        <label>港口<input id="port" required maxlength="60" placeholder="例如：新加坡港" autocomplete="off" /></label>
        <button class="primary-button" type="submit">儲存出差資料</button>
      </form>
    </section>

    <section id="expenseModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="expenseModalTitle">
      <div class="modal__header"><h2 id="expenseModalTitle">新增費用</h2><button class="icon-button close-modal" type="button" aria-label="關閉">×</button></div>
      <form id="expenseForm" class="form-stack">
        <input id="expenseId" type="hidden" />
        <label>發生日期<input id="expenseDate" type="date" required /></label>
        <label>項目<input id="expenseItem" required maxlength="100" placeholder="例如：飯店住宿" autocomplete="off" /></label>
        <div class="form-row">
          <label>分類<select id="expenseCategory" required><option value="交通費">交通費</option><option value="住宿費">住宿費</option><option value="交際費">交際費</option><option value="雜支">雜支</option></select></label>
          <label>幣別<select id="expenseCurrency" required></select></label>
        </div>
        <label id="customCurrencyRow" class="hidden">其他幣別<input id="customCurrency" maxlength="3" pattern="[A-Za-z]{3}" placeholder="例如：AUD" autocapitalize="characters" /></label>
        <label>金額<input id="expenseAmount" type="number" required min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" /></label>
        <p id="formError" class="form-error hidden" role="alert"></p>
        <button class="primary-button" type="submit">儲存費用</button>
      </form>
    </section>

    <script src="app.js"></script>
  </body>
</html>
